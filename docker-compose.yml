version: '3.8'

services:
  # V6Coin 全节点
  v6coin-node:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: v6coin-node
    restart: unless-stopped
    ports:
      - "38901:38901"  # P2P端口
      - "9090:9090"    # RPC端口
    volumes:
      - ./data:/data
      - ./config:/config
      - ./logs:/logs
    environment:
      - V6COIN_LOG_LEVEL=info
      - V6COIN_NETWORK=testnet
    networks:
      - v6coin-network
    healthcheck:
      test: ["CMD", "v6coin-node", "status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: v6coin-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - v6coin-network

  # Grafana 可视化
  grafana:
    image: grafana/grafana:latest
    container_name: v6coin-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - v6coin-network

networks:
  v6coin-network:
    driver: bridge
